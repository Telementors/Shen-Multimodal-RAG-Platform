# =============================================================================
# Shen Multimodal RAG — Docker Compose Configuration
# =============================================================================
# Orchestrates 4 services + 1 init container:
#   1. PostgreSQL 16 + pgvector  (vector database)
#   2. Ollama                    (local LLM server)
#   3. Ollama Init               (one-shot model puller)
#   4. FastAPI Backend           (RAG engine)
#   5. Next.js Frontend          (chat UI)
#
# Usage:
#   docker compose up --build        # first run (builds images)
#   docker compose up                # subsequent runs
#   docker compose down              # stop all services
#   docker compose down -v           # stop + remove volumes (fresh start)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector — Vector Database
  # ---------------------------------------------------------------------------
  # Stores text, table, and image chunk embeddings with HNSW cosine indices.
  # Schema is auto-initialized from schema.sql on first container start.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shen-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: multimodal_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Shen_RAG_Core/indexer/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Ollama — Local LLM Server
  # ---------------------------------------------------------------------------
  # Serves llama3.2 (chat) and nomic-embed-text (embeddings) locally.
  # Models are persisted in the ollama_data volume.
  ollama:
    image: ollama/ollama:latest
    container_name: shen-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Ollama Init — One-Shot Model Puller
  # ---------------------------------------------------------------------------
  # Waits for Ollama to be healthy, then pulls required models.
  # Runs once and exits. Safe to re-run (idempotent).
  ollama-init:
    image: ollama/ollama:latest
    container_name: shen-ollama-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "⏳ Waiting for Ollama server..."
        until ollama list 2>/dev/null; do sleep 2; done
        echo "📦 Pulling nomic-embed-text (embedding model)..."
        ollama pull nomic-embed-text
        echo "📦 Pulling llama3.2 (chat model)..."
        ollama pull llama3.2
        echo "✅ All models ready!"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # FastAPI Backend — RAG Engine
  # ---------------------------------------------------------------------------
  # Handles PDF parsing, embedding, indexing, routing, and answer generation.
  # Reads its config from the .env file in Shen_RAG_Core.
  backend:
    build:
      context: ./Shen_RAG_Core
      dockerfile: Dockerfile
    container_name: shen-rag-backend
    restart: unless-stopped
    env_file:
      - ./Shen_RAG_Core/.env
    environment:
      # Override DATABASE_URL to use Docker's internal networking
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/multimodal_rag
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_RELOAD: "false"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CORPUS_DIR: /app/data/corpus/Ashen_Era_Archive
      CORPUS_NAME: "Ashen Era Archive"
      CORPUS_CLEAN_ON_START: "true"
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/data/uploads
      - backend_images:/app/data/images
      - ./Shen_RAG_Core/Ashen_Era_Data:/app/data/corpus:ro
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Next.js Frontend — Chat UI
  # ---------------------------------------------------------------------------
  # Modern dark-themed chat interface with conversation history.
  # Connects to the backend API at the URL specified by NEXT_PUBLIC_API_URL.
  frontend:
    build:
      context: ./Shen_App
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: shen-app-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  pgdata:          # PostgreSQL data persistence
  ollama_data:     # Ollama model storage (~2-4 GB)
  backend_uploads: # Uploaded PDF files
  backend_images:  # Extracted images from PDFs
