# =============================================================================
# Shen Multimodal RAG — Nginx Reverse Proxy Configuration (Example)
# =============================================================================
# Production reverse proxy that:
#   - Serves the frontend at your domain root
#   - Proxies /api/* requests to the FastAPI backend
#   - Handles CORS, WebSocket upgrades, and file upload limits
#   - Supports optional SSL/TLS termination
#
# Usage:
#   1. Copy this file to your deployment directory
#   2. Update 'server_name' to match your domain
#   3. For SSL: uncomment the HTTPS server block and update cert paths
# =============================================================================

# --- HTTP Server (Development / Non-SSL) ------------------------------------
server {
    listen 80;
    server_name localhost shen.yourdomain.com;

    # --- Logging ---
    access_log /var/log/nginx/shen_access.log;
    error_log  /var/log/nginx/shen_error.log;

    # --- File Upload Limit ---
    # PDF uploads can be large; allow up to 100 MB.
    client_max_body_size 100M;

    # --- Frontend (Next.js) ---
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # WebSocket support (for Next.js HMR in development)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Backend API (FastAPI) ---
    location /api/ {
        # Strip /api prefix: /api/query → /query
        rewrite ^/api/(.*) /$1 break;

        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increased timeouts for large PDF indexing operations
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # --- Backend API Docs (direct access) ---
    location /docs {
        proxy_pass http://localhost:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://localhost:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # --- Health Check ---
    location /health {
        proxy_pass http://localhost:8000/health;
        proxy_set_header Host $host;
    }
}

