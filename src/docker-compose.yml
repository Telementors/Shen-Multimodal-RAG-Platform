services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shen-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: multimodal_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Shen_RAG_Core/indexer/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: shen-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # One-shot init container: pulls required models then exits
  ollama-init:
    image: ollama/ollama:latest
    container_name: shen-ollama-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "⏳ Waiting for Ollama server..."
        until ollama list 2>/dev/null; do sleep 2; done
        echo "📦 Pulling nomic-embed-text (embedding model)..."
        ollama pull nomic-embed-text
        echo "📦 Pulling llama3.2 (chat model)..."
        ollama pull llama3.2
        echo "✅ All models ready!"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  backend:
    build:
      context: ./Shen_RAG_Core
      dockerfile: Dockerfile
    container_name: shen-rag-backend
    restart: unless-stopped
    env_file:
      - ./Shen_RAG_Core/.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/multimodal_rag
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_RELOAD: "false"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CORPUS_DIR: /app/data/corpus/Ashen_Era_Archive
      CORPUS_NAME: "Ashen Era Archive"
      CORPUS_CLEAN_ON_START: "true"
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/data/uploads
      - backend_images:/app/data/images
      - ./Shen_RAG_Core/Ashen_Era_Data:/app/data/corpus:ro
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: ./Shen_App
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: shen-app-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  ollama_data:
  backend_uploads:
  backend_images: